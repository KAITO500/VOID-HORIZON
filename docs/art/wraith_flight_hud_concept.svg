<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="space" x2="0" y2="1"><stop stop-color="#10171b"/><stop offset=".62" stop-color="#1a2226"/><stop offset="1" stop-color="#11171a"/></linearGradient>
    <radialGradient id="haze"><stop stop-color="#8b7556" stop-opacity=".2"/><stop offset="1" stop-color="#8b7556" stop-opacity="0"/></radialGradient>
    <linearGradient id="ship" x2="0" y2="1"><stop stop-color="#c9c2af"/><stop offset=".5" stop-color="#615e56"/><stop offset="1" stop-color="#24282a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
    <style>
      .ivory{fill:#d6ceb8}.stone{fill:#a8a99e}.steel{fill:#777d83}.amber{fill:#c58d50}.teal{fill:#628a85}
      .mono{font-family:'DejaVu Sans Mono',monospace}.sans{font-family:'Arial',sans-serif}.line{fill:none;stroke:#a8a99e;stroke-opacity:.38;stroke-width:1}
      .hair{fill:none;stroke:#d6ceb8;stroke-opacity:.18;stroke-width:1}.cap{font:11px 'DejaVu Sans Mono',monospace;letter-spacing:2px;fill:#a8a99e}
      .small{font:13px 'DejaVu Sans Mono',monospace;letter-spacing:1px;fill:#a8a99e}.big{font:52px 'DejaVu Sans Mono',monospace;letter-spacing:-3px;fill:#d6ceb8}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#space)"/>
  <ellipse cx="970" cy="563" rx="620" ry="360" fill="url(#haze)"/>
  <!-- sparse distant stars -->
  <g fill="#cfc8b8" opacity=".42">
    <circle cx="290" cy="212" r="1"/><circle cx="417" cy="751" r="1.2"/><circle cx="611" cy="302" r=".8"/><circle cx="735" cy="167" r="1"/>
    <circle cx="1254" cy="239" r=".8"/><circle cx="1510" cy="334" r="1.1"/><circle cx="1639" cy="696" r=".8"/><circle cx="1325" cy="842" r="1"/>
    <circle cx="508" cy="889" r=".8"/><circle cx="1438" cy="170" r="1"/><circle cx="1785" cy="497" r=".9"/><circle cx="218" cy="569" r=".7"/>
  </g>
  <!-- thin distant planetary limb -->
  <path d="M505 797 Q960 650 1416 797" fill="none" stroke="#8b7556" stroke-opacity=".18" stroke-width="2"/>
  <path d="M500 801 Q960 654 1420 801" fill="none" stroke="#c58d50" stroke-opacity=".08" stroke-width="8" filter="url(#glow)"/>
  <!-- third-person craft silhouette, deliberately below the center sightline -->
  <g transform="translate(960 770)" stroke="#d6ceb8" stroke-opacity=".42" stroke-width="2">
    <path d="M0 -142 L28 -53 L238 12 L381 72 L365 96 L168 74 L94 112 L42 106 L24 58 L-24 58 L-42 106 L-94 112 L-168 74 L-365 96 L-381 72 L-238 12 L-28 -53Z" fill="url(#ship)"/>
    <path d="M0 -125 L18 -42 L0 22 L-18 -42Z" fill="#77776f"/>
    <path d="M-260 43 L-112 58 L-72 91 L-337 78Z M260 43 L112 58 L72 91 L337 78Z" fill="#807a6d"/>
    <path d="M-30 -45 L-158 9 L-58 22 L-15 -1 M30 -45 L158 9 L58 22 L15 -1" fill="none" stroke="#22282a" stroke-width="14"/>
    <path d="M-185 66 L-330 77 M185 66 L330 77" fill="none" stroke="#c58d50" stroke-width="3"/>
    <path d="M-27 -51 L-16 -82 L16 -82 L27 -51Z" fill="#527f7d" fill-opacity=".72"/>
    <circle cx="-55" cy="-7" r="7" fill="#c58d50" stroke="none"/><circle cx="55" cy="-7" r="7" fill="#c58d50" stroke="none"/>
  </g>
  <!-- restrained perimeter frame with clipped corners -->
  <path d="M30 92V32H90 M1830 32h60v60 M30 988v60h60 M1890 988v60h-60" class="line"/>
  <path d="M30 150v46m0 688v46M1890 150v46m0 688v46" class="hair"/>
  <!-- identification -->
  <g transform="translate(82 76)">
    <path d="M0 0h28l-14 25H0z" fill="#c58d50"/><text x="42" y="8" class="cap">VOID HORIZON</text>
    <text x="0" y="59" class="sans ivory" font-size="21" letter-spacing="2">VH-01 <tspan fill="#777d83">/</tspan> WRAITH</text>
    <circle cx="5" cy="83" r="3" fill="#628a85"/><text x="17" y="87" class="cap" font-size="9">FLIGHT INTERFACE / ACTIVE</text>
  </g>
  <!-- navigation instrument -->
  <g transform="translate(960 82)" text-anchor="middle">
    <text y="0" class="cap">HEADING</text>
    <text y="51" class="mono ivory" font-size="34" letter-spacing="1">032<tspan fill="#a8a99e" font-size="17">°</tspan><tspan fill="#777d83" font-size="13">  NNE</tspan></text>
    <path d="M-150 75H150" class="line"/>
    <g stroke="#a8a99e" stroke-opacity=".65">
      <path d="M-132 75v-7M-88 75v-7M-44 75v-10M0 75v-18M44 75v-10M88 75v-7M132 75v-7"/>
    </g>
    <path d="M-4 56h8l-4 6z" fill="#c58d50"/>
    <text x="-132" y="96" class="cap" font-size="8">W</text><text x="-44" y="96" class="cap" font-size="8">N</text><text x="44" y="96" class="cap" font-size="8">E</text><text x="128" y="96" class="cap" font-size="8">S</text>
    <text y="119" class="cap" font-size="9">PITCH  +02°     ROLL  −01°</text>
  </g>
  <g transform="translate(1838 82)" text-anchor="end"><text class="cap">ORBITAL DATA  /  UNAVAILABLE</text><text y="28" class="cap" font-size="9">DEEP SPACE  ·  FREE FLIGHT</text></g>
  <!-- left speed, no boxed card -->
  <g transform="translate(84 423)">
    <path d="M0 0v181" stroke="#c58d50" stroke-width="2" stroke-opacity=".8"/>
    <text x="23" y="7" class="cap">VELOCITY</text><text x="23" y="25" class="cap" font-size="9">RELATIVE  /  M·S⁻¹</text>
    <text x="20" y="91" class="big">286</text><text x="25" y="117" class="small">M/S</text>
    <path d="M22 140H205" stroke="#777d83" stroke-opacity=".4"/><path d="M22 140h147" stroke="#628a85" stroke-width="3"/>
    <path d="M22 136v8m46-5v3m46-5v7m46-5v3m45-5v7" stroke="#a8a99e" stroke-opacity=".55"/>
    <text x="22" y="165" class="cap" font-size="8">SPEED ENVELOPE</text>
  </g>
  <!-- right propulsion: line based, full readability -->
  <g transform="translate(1612 389)">
    <path d="M246 0v223" stroke="#628a85" stroke-width="2" stroke-opacity=".8"/>
    <text x="0" y="7" class="cap">PROPULSION</text><text x="0" y="32" class="mono ivory" font-size="18">ENGINE OUTPUT</text>
    <text x="224" y="32" class="mono amber" font-size="20" text-anchor="end">82%</text>
    <path d="M0 48H224" class="line"/><path d="M0 48H184" stroke="#628a85" stroke-width="3"/>
    <text x="0" y="86" class="cap">BOOST RESERVE</text><text x="224" y="86" class="small" text-anchor="end">43%</text>
    <g transform="translate(0 100)" fill="#c58d50"><rect width="28" height="7"/><rect x="37" width="28" height="7"/><rect x="74" width="28" height="7"/><rect x="111" width="28" height="7"/><rect x="148" width="28" height="7" opacity=".24"/><rect x="185" width="28" height="7" opacity=".24"/></g>
    <circle cx="6" cy="139" r="3" fill="#628a85"/><text x="18" y="143" class="cap" font-size="9">FLIGHT ASSIST</text><text x="224" y="143" class="small" text-anchor="end">ON</text>
    <path d="M0 166H224" class="hair"/><text x="0" y="190" class="cap" font-size="9">THROTTLE  /  MANUAL</text><text x="224" y="190" class="small" text-anchor="end">82%</text>
  </g>
  <!-- center sight, fine and open -->
  <g transform="translate(960 540)" fill="none" stroke="#d6ceb8" stroke-opacity=".75" stroke-width="1.3">
    <path d="M-20 0h-11m62 0h-11M0-20v-11m0 62V20"/><path d="M-5-5a7 7 0 0 1 10 0v10a7 7 0 0 1-10 0z" stroke="#c58d50"/>
    <circle r="2" fill="#c58d50" stroke="none"/>
  </g>
  <g transform="translate(886 588)" class="cap" font-size="8"><path d="M0 0h42" class="hair"/><text y="17">NOSE VECTOR</text></g>
  <!-- faint attitude ladder, only in central clear region -->
  <g transform="translate(960 542)" stroke="#a8a99e" stroke-opacity=".15" fill="none">
    <path d="M-130 82h36m-36 0v-4M94 82h36m36 0v-4M-190 135h28m-28 0v-4M162 135h28m28 0v-4"/>
  </g>
  <!-- lower system readouts -->
  <g transform="translate(84 896)">
    <path d="M0 0h210" class="line"/><text y="23" class="cap">SYSTEM FEED</text><circle cx="7" cy="49" r="3" fill="#777d83"/>
    <text x="18" y="53" class="small">ALERT FEED / NO DATA</text>
  </g>
  <g transform="translate(1612 866)">
    <path d="M0 0h224" class="line"/><text y="23" class="cap">NAVIGATION TARGET</text>
    <path d="M3 45l7 7-7 7-7-7z" fill="none" stroke="#777d83"/><text x="22" y="56" class="small">NO TARGET LOCK</text>
    <text y="81" class="cap" font-size="8">NAV FEED  /  UNAVAILABLE</text>
  </g>
  <g transform="translate(960 1016)" text-anchor="middle"><path d="M-260 0h520" class="hair"/><text y="23" class="cap" font-size="9">W / S  THRUST     MOUSE  FLIGHT     Q / E  ROLL     SHIFT  BOOST     X  BRAKE</text></g>
  <g transform="translate(90 1030)"><text class="cap" font-size="8">ABYSSAL RETROFUTURISM  /  FLIGHT INTERFACE STUDY  01</text></g>
</svg>

