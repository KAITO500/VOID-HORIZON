<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <linearGradient id="bg" y2="1"><stop stop-color="#0b1013"/><stop offset=".55" stop-color="#182023"/><stop offset="1" stop-color="#090d0f"/></linearGradient>
 <linearGradient id="center" x2="0" y2="1"><stop stop-color="#293033"/><stop offset="1" stop-color="#161c1e"/></linearGradient>
 <linearGradient id="side" x2="0" y2="1"><stop stop-color="#232a2c"/><stop offset="1" stop-color="#101517"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="22"/></filter>
 <style>.ivory{fill:#d6ceb8}.stone{fill:#a8a99e}.steel{fill:#777d83}.amber{fill:#c58d50}.teal{fill:#64817c}.mono{font-family:Consolas,'DejaVu Sans Mono',monospace}.cap{font:11px Consolas,monospace;letter-spacing:2px}.small{font:13px Consolas,monospace;letter-spacing:1px}.tiny{font:10px Consolas,monospace;letter-spacing:1px}.line{fill:none;stroke:#a8a99e;stroke-opacity:.38;stroke-width:1}</style>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<text x="72" y="74" class="mono ivory" font-size="23" letter-spacing="4">VOID HORIZON</text><text x="72" y="105" class="cap stone">VH-01 WRAITH  /  PANORAMIC HUD STUDY</text>
<text x="1845" y="74" text-anchor="end" class="cap amber">B  /  THREE-QUARTER VIEW</text><text x="1845" y="105" text-anchor="end" class="tiny stone">CAMERA OFFSET  ·  PHYSICAL PANEL GEOMETRY</text>
<!-- soft shadow behind a display whose actual planes have separate orientations/depths -->
<path d="M135 314 Q930 172 1780 308 L1764 906 Q920 1056 152 902Z" fill="#000" opacity=".64" filter="url(#shadow)"/>
<!-- far left peripheral surface plane: noticeably foreshortened and angled away -->
<path d="M175 308 L535 254 L598 898 L148 935 Z" fill="url(#side)" stroke="#777d83" stroke-opacity=".65" stroke-width="2"/>
<path d="M195 340 L523 293 L568 853 L172 888 Z" fill="#1a2022" stroke="#c58d50" stroke-opacity=".42"/>
<g transform="matrix(.78,-.10,.07,1,206,383)"><text x="0" y="0" class="cap stone">PROPULSION</text><text x="0" y="45" class="mono ivory" font-size="22">ENGINE OUTPUT</text><text x="0" y="86" class="mono amber" font-size="32">68%</text><rect x="0" y="105" width="300" height="6" fill="#777d83" fill-opacity=".28"/><rect x="0" y="105" width="204" height="6" fill="#64817c"/><text x="0" y="170" class="cap stone">BOOST RESERVE</text><rect x="0" y="192" width="300" height="7" fill="#777d83" fill-opacity=".28"/><rect x="0" y="192" width="216" height="7" fill="#c58d50"/><text x="0" y="231" class="small teal">ASSIST / ON</text><path d="M0 266H300M0 315H300" class="line"/><text x="0" y="297" class="small ivory">THRUST VECTOR</text><text x="0" y="355" class="cap stone">FLIGHT SYSTEM / ACTIVE</text><path d="M0 392H300" class="line"/><text x="0" y="431" class="small ivory">HULL TELEMETRY</text><text x="0" y="461" class="tiny steel">NO FAULTS REPORTED</text></g>
<!-- central closer frontal plane -->
<path d="M534 254 L1390 238 L1394 915 L598 898 Z" fill="url(#center)" stroke="#c58d50" stroke-opacity=".58" stroke-width="2.5"/>
<path d="M558 282 L1365 269 L1368 880 L620 866 Z" fill="#171d1f" stroke="#777d83" stroke-opacity=".55"/>
<!-- projected spacecraft behind front-center primary instruments -->
<g opacity=".34"><path d="M690 597 L822 504 1008 464 1168 492 1314 574 1198 601 1135 659 1035 647 964 618 888 653 793 639Z" fill="#9c988a" stroke="#d6ceb8" stroke-opacity=".65" stroke-width="3"/><path d="M844 510 928 484 1047 491 1100 526 1086 572 920 575 855 551Z" fill="#263338" stroke="#a8a99e" stroke-width="2"/><circle cx="1240" cy="552" r="39" fill="none" stroke="#c58d50" stroke-width="8"/><circle cx="1305" cy="566" r="47" fill="none" stroke="#777d83" stroke-width="7"/></g>
<!-- central heading, speed, stable reticle: nearly frontal -->
<g transform="translate(840 304)" text-anchor="middle"><path d="M0 0H310V120H0Z" fill="#202629" stroke="#c58d50" stroke-opacity=".52"/><text x="155" y="52" class="mono ivory" font-size="34">036° / N</text><path d="M20 83H290" class="line"/><path d="M155 69v14" stroke="#c58d50"/><g stroke="#d6ceb8" stroke-opacity=".65"><path d="M60 77v6M105 73v10M155 66v17M205 73v10M250 77v6"/></g><text x="155" y="107" class="tiny stone">PITCH +05°  ·  ROLL +08°</text></g>
<g transform="translate(882 708)"><path d="M0 0H420V165H0Z" fill="#202629" stroke="#c58d50" stroke-opacity=".55"/><text x="22" y="32" class="cap stone">VELOCITY / RELATIVE</text><text x="22" y="104" class="mono ivory" font-size="62">286</text><text x="273" y="101" class="mono stone" font-size="15">M/S</text><rect x="22" y="127" width="374" height="5" fill="#777d83" fill-opacity=".3"/><rect x="22" y="127" width="307" height="5" fill="#64817c"/></g>
<g transform="translate(1045 588)" fill="none" stroke="#d6ceb8" stroke-opacity=".86" stroke-width="1.5"><path d="M-28 0h16M12 0h16M0-28v16M0 12v16"/><circle r="2" fill="#c58d50" stroke="none"/></g>
<!-- right target panel on another tangent plane, physically recessed and foreshortened -->
<path d="M1390 238 L1774 311 L1772 906 L1394 915 Z" fill="url(#side)" stroke="#777d83" stroke-opacity=".65" stroke-width="2"/>
<path d="M1418 276 L1744 340 L1741 865 L1420 878 Z" fill="#1b2123" stroke="#777d83" stroke-opacity=".62"/>
<g transform="matrix(.77,.14,-.05,1,1455,385)"><text x="0" y="0" class="cap stone">NAVIGATION TARGET</text><text x="0" y="49" class="mono teal" font-size="23">RELAY K-07</text><text x="0" y="82" class="small ivory">18.4 KM / MOCK</text><path d="M0 111H300" class="line"/><text x="0" y="148" class="tiny steel">TARGET LOCK / SELECTED</text><path d="M0 216H300" class="line"/><text x="0" y="251" class="cap stone">SYSTEM FEED</text><text x="0" y="285" class="small ivory">NO WARNINGS</text><text x="0" y="338" class="cap stone">FLIGHT ASSIST</text><text x="0" y="374" class="small teal">ACTIVE</text></g>
<!-- distinct depth planes and tangent edges make curvature legible without bent text -->
<path d="M148 935 L598 898 M598 898 L1394 915 M1394 915 L1772 906" fill="none" stroke="#c58d50" stroke-opacity=".55" stroke-width="2"/>
<path d="M135 301 L531 246 M1403 230 L1784 303" fill="none" stroke="#a8a99e" stroke-opacity=".6" stroke-width="1"/>
<text x="960" y="1000" text-anchor="middle" class="cap stone">CONCAVE FLIGHT DISPLAY  /  INDEPENDENT TANGENT PANELS  /  THREE DEPTH LEVELS</text>
<text x="960" y="1033" text-anchor="middle" class="tiny amber">DESIGN PRESENTATION  ·  MOCK FLIGHT DATA  ·  SIDE PLANES ROTATE AWAY FROM PILOT</text>
</svg>

