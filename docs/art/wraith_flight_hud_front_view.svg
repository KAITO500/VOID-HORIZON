<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <linearGradient id="bg" y2="1"><stop stop-color="#0c1114"/><stop offset=".55" stop-color="#1a2022"/><stop offset="1" stop-color="#0b1012"/></linearGradient>
 <radialGradient id="haze"><stop stop-color="#8b7354" stop-opacity=".24"/><stop offset="1" stop-color="#8b7354" stop-opacity="0"/></radialGradient>
 <linearGradient id="hull" x2="0" y2="1"><stop stop-color="#d0c8b5"/><stop offset=".48" stop-color="#706e65"/><stop offset="1" stop-color="#282d2e"/></linearGradient>
 <linearGradient id="glass" y2="1"><stop stop-color="#314146"/><stop offset="1" stop-color="#10191d"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
 <style>
 .ivory{fill:#d6ceb8}.stone{fill:#a8a99e}.steel{fill:#777d83}.amber{fill:#c58d50}.teal{fill:#64817c}.mono{font-family:Consolas,'DejaVu Sans Mono',monospace}.sans{font-family:Arial,sans-serif}.cap{font:11px Consolas,monospace;letter-spacing:2px}.small{font:13px Consolas,monospace;letter-spacing:1px}.tiny{font:10px Consolas,monospace;letter-spacing:1.5px}.big{font:68px Consolas,monospace;letter-spacing:-4px}.line{fill:none;stroke:#a8a99e;stroke-opacity:.36;stroke-width:1}.hair{fill:none;stroke:#d6ceb8;stroke-opacity:.18;stroke-width:1}
 </style>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/><ellipse cx="1000" cy="530" rx="720" ry="470" fill="url(#haze)"/>
<!-- Flight-scene silhouette behind the instruments -->
<g opacity=".60" transform="translate(0,30)">
 <path d="M440 590 L620 520 790 472 888 436 1012 443 1110 474 1268 514 1458 573 1278 599 1180 651 1112 700 1040 686 975 637 898 626 836 681 746 698 689 648 590 622Z" fill="url(#hull)" stroke="#d6ceb8" stroke-opacity=".32" stroke-width="3"/>
 <path d="M624 520 790 476 858 482 809 553 681 579 497 612Z M1270 515 1117 478 1058 485 1102 555 1254 575 1411 596Z" fill="#b7b09e" stroke="#ded2b9" stroke-opacity=".48" stroke-width="2"/>
 <path d="M850 484 905 458 1007 462 1073 489 1100 550 1055 579 880 570 832 541Z" fill="url(#glass)" stroke="#c0baa8" stroke-opacity=".55" stroke-width="3"/>
 <path d="M548 608 733 593 792 620 772 661 630 663ZM1240 589 1370 605 1324 650 1193 651 1157 620Z" fill="#333839" stroke="#85857a" stroke-opacity=".4"/>
 <g fill="#1c2223" stroke="#aaa18f" stroke-opacity=".42"><circle cx="1450" cy="524" r="52"/><circle cx="1538" cy="539" r="63"/><circle cx="1450" cy="524" r="28" fill="#c58d50" fill-opacity=".3"/><circle cx="1538" cy="539" r="35" fill="#c58d50" fill-opacity=".2"/></g>
 <path d="M1450 506a18 18 0 1 0 0 36 18 18 0 1 0 0-36M1538 518a21 21 0 1 0 0 42 21 21 0 1 0 0-42" fill="none" stroke="#c58d50" stroke-width="7" stroke-opacity=".8"/>
</g>
<rect width="1920" height="1080" fill="#090d0f" opacity=".24"/>
<!-- Curved cockpit glass indication is subtle; the UI planes themselves remain frontal in this view. -->
<path d="M42 150 Q960 74 1878 150 M42 928 Q960 1006 1878 928" class="hair"/>
<!-- peripheral instruments -->
<g transform="translate(78 70)"><path d="M0 0H450V132H0Z" fill="#202629" fill-opacity=".78" stroke="#85877f" stroke-opacity=".55"/><text x="0" y="20" class="cap stone">VOID HORIZON / FLIGHT SYSTEM</text><text x="0" y="58" class="mono ivory" font-size="27">VH-01  /  WRAITH</text><circle cx="5" cy="103" r="4" fill="#64817c"/><text x="20" y="107" class="tiny stone">FLIGHT INTERFACE / ACTIVE</text></g>
<g transform="translate(1392 76)" text-anchor="end"><path d="M0 0H450V112H0Z" fill="#202629" fill-opacity=".76" stroke="#777d83" stroke-opacity=".55"/><text x="440" y="22" class="cap stone">ORBITAL DATA / UNAVAILABLE</text><text x="440" y="56" class="small ivory">DEEP SPACE  ·  FREE FLIGHT</text><text x="440" y="88" class="tiny steel">VH-01  /  SYSTEM STATUS</text></g>
<g transform="translate(78 904)"><path d="M0 0H450V106H0Z" fill="#202629" fill-opacity=".82" stroke="#777d83" stroke-opacity=".55"/><text x="0" y="22" class="cap stone">SYSTEM FEED</text><circle cx="5" cy="57" r="4" fill="#777d83"/><text x="20" y="62" class="small ivory">ALERT FEED  /  NO DATA</text></g>
<g transform="translate(90 625)"><path d="M0 0H500V260H0Z" fill="#202629" fill-opacity=".84" stroke="#777d83" stroke-opacity=".62"/><text x="18" y="32" class="cap stone">PROPULSION</text><text x="18" y="82" class="mono ivory" font-size="21">ENGINE OUTPUT</text><text x="478" y="82" class="mono amber" font-size="24" text-anchor="end">68%</text><rect x="18" y="103" width="450" height="5" fill="#777d83" fill-opacity=".3"/><rect x="18" y="103" width="306" height="5" fill="#64817c"/><text x="18" y="151" class="cap stone">BOOST RESERVE</text><rect x="18" y="170" width="450" height="7" fill="#777d83" fill-opacity=".3"/><rect x="18" y="170" width="324" height="7" fill="#c58d50"/><text x="18" y="203" class="small amber">READY  ·  72%</text><text x="18" y="241" class="small teal">ASSIST  /  ON</text></g>
<g transform="translate(1390 206)"><path d="M0 0H450V206H0Z" fill="#202629" fill-opacity=".84" stroke="#777d83" stroke-opacity=".62"/><text x="18" y="32" class="cap stone">NAVIGATION TARGET</text><text x="18" y="82" class="mono teal" font-size="23">RELAY K-07</text><text x="18" y="119" class="small stone">18.4 KM  /  MOCK FEED</text><path d="M18 148H430" class="line"/><text x="18" y="181" class="tiny steel">STATE PREVIEW  /  NO GAME TARGET FEED</text></g>
<!-- central heading plane -->
<g transform="translate(790 62)" text-anchor="middle"><path d="M0 0H340V142H0Z" fill="#202629" fill-opacity=".74" stroke="#c58d50" stroke-opacity=".48"/><text x="170" y="61" class="mono ivory" font-size="40">036°  /  N</text><path d="M20 101H320" class="line"/><path d="M170 81V101" stroke="#c58d50"/><path d="M162 82H178L170 91Z" fill="#c58d50"/><g stroke="#d6ceb8" stroke-opacity=".7"><path d="M40 94v7M84 89v12M128 94v7M170 83v18M212 94v7M256 89v12M300 94v7"/></g><text x="170" y="131" class="tiny stone">PITCH  +05°     ROLL  +08°</text></g>
<!-- speed, closest plane -->
<g transform="translate(748 711)"><path d="M0 0H424V246H0Z" fill="#202629" fill-opacity=".87" stroke="#c58d50" stroke-opacity=".48"/><text x="24" y="38" class="cap stone">VELOCITY / RELATIVE</text><text x="24" y="124" class="big ivory">286</text><text x="306" y="123" class="mono stone" font-size="15">M/S</text><rect x="24" y="157" width="370" height="5" fill="#777d83" fill-opacity=".3"/><rect x="24" y="157" width="304" height="5" fill="#64817c"/><text x="24" y="202" class="tiny steel">SPEED ENVELOPE</text></g>
<!-- stable closest reticle -->
<g transform="translate(960 540)" fill="none" stroke="#d6ceb8" stroke-opacity=".8" stroke-width="1.5"><path d="M-30 0h18M12 0h18M0-30v18M0 12v18"/><path d="M-7-5a9 9 0 0 1 14 0M7 5a9 9 0 0 1-14 0"/><circle r="2" fill="#c58d50" stroke="none"/></g>
<text x="960" y="1062" text-anchor="middle" class="tiny amber">DESIGN PREVIEW  ·  MOCK FLIGHT DATA</text>
</svg>

